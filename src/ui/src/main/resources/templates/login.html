<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/bare :: bare (~{::body})}"
>
  <body>
    <main class="flex flex-1 items-center justify-center px-4 py-16">
      <section class="w-full max-w-md rounded-lg border border-gray-200 bg-white p-8 shadow-sm">
        <p class="text-sm font-semibold uppercase tracking-wide text-primary-500">Account</p>
        <h1 class="mt-2 text-3xl font-bold text-gray-800">Sign in</h1>
        <p class="mt-2 text-sm text-gray-500">Sign in to view your orders.</p>
        <p th:if="${param.error}" class="mt-4 rounded bg-red-50 p-3 text-sm text-red-700">
          Invalid email or password.
        </p>
        <form th:action="@{/login}" method="post" class="mt-6 space-y-4">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700">E-mail</label>
            <input id="username" name="username" type="email" required class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500" />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input id="password" name="password" type="password" required class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500" />
          </div>
          <button type="submit" class="w-full rounded-md bg-primary-500 px-4 py-2 font-medium text-white hover:bg-primary-700">Sign in</button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-500">
          New here? <a th:href="@{/register}" class="font-medium text-primary-500 hover:text-primary-700">Create an account</a>
        </p>
      </section>
    </main>
  </body>
</html>
