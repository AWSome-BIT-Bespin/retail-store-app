replicaCount: 1

image:
  repository: redis
  pullPolicy: IfNotPresent
  tag: '6.0-alpine'

nameOverride: retail-redis
fullnameOverride: retail-redis

service:
  type: ClusterIP
  port: 6379

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

nodeSelector: {}

tolerations: []

affinity: {}
