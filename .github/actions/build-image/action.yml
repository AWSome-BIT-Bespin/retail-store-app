name: Build one retail image
description: Build a single linux/amd64 image locally without cloud authentication or publication.
inputs:
  service:
    description: One of cart, catalog, checkout, orders, or ui.
    required: true
outputs:
  local-image:
    description: Local Docker image reference.
    value: ${{ steps.metadata.outputs.local_image }}
  ecr-image:
    description: Intended ECR image reference; existence is not implied.
    value: ${{ steps.metadata.outputs.ecr_image }}
  gar-image:
    description: Intended Artifact Registry image reference; existence is not implied.
    value: ${{ steps.metadata.outputs.gar_image }}
runs:
  using: composite
  steps:
    - name: Create unique image references
      id: metadata
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
      run: node ci/images.mjs metadata
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Build once and load locally
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: src/${{ inputs.service }}
        file: src/${{ inputs.service }}/Dockerfile
        platforms: linux/amd64
        load: true
        push: false
        provenance: false
        sbom: false
        tags: ${{ steps.metadata.outputs.local_image }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=retail-${{ inputs.service }}
        cache-to: type=gha,scope=retail-${{ inputs.service }},mode=max
